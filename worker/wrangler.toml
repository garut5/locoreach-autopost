name = "locoreach-scheduler"
main = "src/index.js"
compatibility_date = "2026-09-02"

# 公開URLを作らない。外から叩けるものではないので
workers_dev = false

# すべて UTC。予定どおりの時刻（11:00 / 18:00 / 20:00 JST）に置く。
# 先にこちらが投げるので、あとから GitHub の遅い schedule が発火しても
# 投稿側の重複判定で止まる。
#
# GitHub 側の cron は 8/31 に「毎時00分は混む」という理由で分をずらした。
# その変更は効かず、遅れは +5〜8時間のままだった。Cloudflare の
# Cron Triggers は自前で時刻を持つので、その理由は当てはまらない。
# 引き継いでいた +20/+15/+40分のずれを外す。
# ログを残す。9/2 に「Worker は成功しているのに dispatch が届かない」
# という状態を調べたとき、ログが無効で原因を絞り込めなかった。
[observability]
enabled = true

[triggers]
# 無料枠は cron トリガーが1アカウント5本まで。ほかの Worker が3本
# 使っているので、ここは2本に収める。18:00 と 20:00 をひとつにまとめた。
# 式を増やすときは src/index.js の JOBS も必ず合わせること。
# 片方だけだと、発火しても何もせずに終わる（9/2 に一度踏んだ）。
crons = [
  "0 2 * * *",     # 11:00 JST 会社サイト
  "0 9,11 * * *",  # 18:00 JST 縦動画 / 20:00 JST カルーセル・記事拡散
]

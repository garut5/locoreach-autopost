name: リール動画を作って投稿する

# 当面は手動実行のみ。publish の既定は no（作るだけ・投稿しない）。
# 中身を Artifacts で確認してから publish=yes に切り替える運用。
# 既存の post.yml（20:00 JST・フィード／ストーリーズ／Threads）には一切関与しない。
on:
  workflow_dispatch:
    inputs:
      day:
        description: "曜日キー（mon〜sun）。空なら当日"
        required: false
        default: ""
      narration:
        description: "ナレーションを入れる（voicevox / none）"
        type: choice
        options: [voicevox, none]
        default: voicevox
      publish:
        description: "Instagram へ実際に投稿する"
        type: choice
        options: ["no", "yes"]
        default: "no"

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      # VOICEVOX ENGINE。無料・日本語専用。商用利用可だがクレジット表記が必要。
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
        ports:
          - 50021:50021

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet numpy Pillow

      - name: 曜日とファイル名を決める
        id: name
        run: |
          DAY="${{ inputs.day }}"
          if [ -z "$DAY" ]; then
            DAY=$(TZ=Asia/Tokyo date +%a | tr 'A-Z' 'a-z')
          fi
          STAMP=$(TZ=Asia/Tokyo date +%Y%m%d-%H%M)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "file=$STAMP-$DAY.mp4" >> "$GITHUB_OUTPUT"
          echo "曜日=$DAY / ファイル名=$STAMP-$DAY.mp4"

      - name: VOICEVOX の起動を待つ
        if: ${{ inputs.narration == 'voicevox' }}
        run: |
          for i in $(seq 1 60); do
            if curl -sS --max-time 5 http://127.0.0.1:50021/version >/dev/null 2>&1; then
              echo "VOICEVOX 起動: $(curl -sS http://127.0.0.1:50021/version)"
              exit 0
            fi
            sleep 5
          done
          echo "VOICEVOX が起動しませんでした"; exit 1

      - name: ナレーション音声を合成
        if: ${{ inputs.narration == 'voicevox' }}
        env:
          VOICEVOX_URL: http://127.0.0.1:50021
          VOICEVOX_SPEAKER: ${{ vars.VOICEVOX_SPEAKER || '3' }}
        run: |
          mkdir -p out
          python3 video/narrate.py --day "${{ steps.name.outputs.day }}" --out out/narration.wav

      - name: 動画を作る
        id: build
        run: |
          mkdir -p out
          if [ -f out/narration.wav ]; then
            python3 video/build.py --day "${{ steps.name.outputs.day }}" --out out/reel.mp4 --narration out/narration.wav
            echo "narration_used=1" >> "$GITHUB_OUTPUT"
          else
            python3 video/build.py --day "${{ steps.name.outputs.day }}" --out out/reel.mp4
            echo "narration_used=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成物を確認
        run: |
          ls -la out/
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 out/reel.mp4
          ffmpeg -hide_banner -i out/reel.mp4 -af volumedetect -f null - 2>&1 | grep -E "mean_volume|max_volume"

      - uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.name.outputs.day }}
          path: out/
          retention-days: 7

      # ここから先は R2 の認証情報が無ければ自動でスキップされる
      - name: R2 へ置く
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 video/upload.py --file out/reel.mp4 --name "${{ steps.name.outputs.file }}"

      - name: 配信URLが本当に返るか確かめる
        if: ${{ steps.upload.outputs.video_url != '' }}
        run: |
          URL="${{ steps.upload.outputs.video_url }}"
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$URL" || echo 000)
            echo "  試行 $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "配信URLが 200 を返しません: $URL"; exit 1

      - name: Instagram Reels へ投稿
        if: ${{ steps.upload.outputs.video_url != '' }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          NARRATION_USED: ${{ steps.build.outputs.narration_used }}
          TTS_CREDIT: ${{ vars.TTS_CREDIT || 'VOICEVOX:ずんだもん' }}
        run: |
          if [ "${{ inputs.publish }}" = "yes" ]; then
            python3 video/publish.py --day "${{ steps.name.outputs.day }}" --video-url "${{ steps.upload.outputs.video_url }}"
          else
            python3 video/publish.py --day "${{ steps.name.outputs.day }}" --video-url "${{ steps.upload.outputs.video_url }}" --dry-run
          fi

      - name: R2 が未設定のとき
        if: ${{ steps.upload.outputs.video_url == '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のため、"
          echo "アップロードと投稿を行っていません。動画は Artifacts にあります。"

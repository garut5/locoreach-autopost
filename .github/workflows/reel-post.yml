name: 縦動画を作って投稿する（Reels / ショート / TikTok / Threads）

# 毎日18:00 JST。その日の記事から縦動画を作って各媒体へ出す。
# カルーセルは20:00（post.yml）なので、2時間ずらして重ならないようにしている。
#
# 定期実行では inputs が空になる。空のまま条件式に使うとどの投稿先にも
# 当たらず、黙って何もせず終わる。既定は「設定を決める」ステップで埋める。
on:
  schedule:
    # 09:00 UTC = 18:00 JST
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "曜日キー（mon〜sun）。空なら当日"
        required: false
        default: ""
      narration:
        description: "ナレーションを入れる（voicevox / none）"
        type: choice
        options: [voicevox, none]
        default: voicevox
      source:
        description: "article=その日の記事から作る（毎日ちがう） / fixed=曜日固定の7本"
        type: choice
        options: [article, fixed]
        default: article
      format:
        description: "short=5枚・約25秒（推奨） / full=カルーセル10枚・約70秒"
        type: choice
        options: [short, full]
        default: short
      publish:
        description: "実際に投稿する（no なら内容の確認だけ）"
        type: choice
        options: ["no", "yes"]
        default: "no"
      yt_privacy:
        description: "YouTube の公開設定。初回は private で当たりを確かめる"
        type: choice
        options: ["", private, unlisted, public]
        default: ""
      targets:
        description: "投稿先"
        type: choice
        options: [all, instagram, youtube, tiktok, threads]
        default: all

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      # VOICEVOX ENGINE。無料・日本語専用。商用利用可だがクレジット表記が必要。
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
        ports:
          - 50021:50021

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install --quiet numpy Pillow

      - name: 曜日とファイル名を決める
        id: name
        env:
          IN_DAY: ${{ inputs.day }}
        run: |
          DAY="$IN_DAY"
          if [ -z "$DAY" ]; then
            DAY=$(TZ=Asia/Tokyo date +%a | tr 'A-Z' 'a-z')
          fi
          # ここで mon〜sun 以外を弾く。後段のステップは
          # steps.name.outputs.day を使うので、入口で絞れば全体が守られる。
          case "$DAY" in
            mon|tue|wed|thu|fri|sat|sun) ;;
            *) echo "曜日は mon〜sun のいずれかで指定してください: $DAY"; exit 1 ;;
          esac
          STAMP=$(TZ=Asia/Tokyo date +%Y%m%d-%H%M)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "file=$STAMP-$DAY.mp4" >> "$GITHUB_OUTPUT"
          echo "曜日=$DAY / ファイル名=$STAMP-$DAY.mp4"

      # 定期実行では inputs が空。ここで既定に寄せて、以降はこの出力だけを見る
      - name: 設定を決める
        id: cfg
        env:
          IN_PUBLISH: ${{ inputs.publish }}
          IN_TARGETS: ${{ inputs.targets }}
          IN_FORMAT: ${{ inputs.format }}
          IN_SOURCE: ${{ inputs.source }}
          IN_YT: ${{ inputs.yt_privacy }}
          IN_NARRATION: ${{ inputs.narration }}
          VAR_TARGETS: ${{ vars.REEL_TARGETS }}
          VAR_YT: ${{ vars.YT_PRIVACY }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            PUBLISH=yes
            TARGETS="${VAR_TARGETS:-all}"
          else
            PUBLISH="${IN_PUBLISH:-no}"
            TARGETS="${IN_TARGETS:-all}"
          fi
          {
            echo "publish=$PUBLISH"
            echo "targets=$TARGETS"
            echo "format=${IN_FORMAT:-short}"
            echo "source=${IN_SOURCE:-article}"
            echo "yt_privacy=${IN_YT:-${VAR_YT:-public}}"
            echo "narration=${IN_NARRATION:-voicevox}"
          } >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH / targets=$TARGETS / format=${IN_FORMAT:-short} / source=${IN_SOURCE:-article}"

      - name: VOICEVOX の起動を待つ
        if: ${{ steps.cfg.outputs.narration == 'voicevox' }}
        run: |
          for i in $(seq 1 60); do
            if curl -sS --max-time 5 http://127.0.0.1:50021/version >/dev/null 2>&1; then
              echo "VOICEVOX 起動: $(curl -sS http://127.0.0.1:50021/version)"
              exit 0
            fi
            sleep 5
          done
          echo "VOICEVOX が起動しませんでした"; exit 1

      - name: ショート用のカードを描く
        if: ${{ steps.cfg.outputs.format == 'short' }}
        env:
          IN_SOURCE: ${{ steps.cfg.outputs.source }}
        run: |
          SRC="${IN_SOURCE:-article}"
          python3 video/short.py --source "$SRC" --day "${{ steps.name.outputs.day }}"
          python3 video/cards.py --source "$SRC" --day "${{ steps.name.outputs.day }}" --outdir out/cards

      - name: ナレーション音声を合成
        if: ${{ steps.cfg.outputs.narration == 'voicevox' }}
        env:
          VOICEVOX_URL: http://127.0.0.1:50021
          VOICEVOX_SPEAKER_NAME: ${{ vars.VOICEVOX_SPEAKER_NAME || '玄野武宏' }}
          IN_FORMAT: ${{ steps.cfg.outputs.format }}
        run: |
          mkdir -p out
          python3 video/narrate.py --day "${{ steps.name.outputs.day }}" --outdir out/voice --format "${IN_FORMAT:-short}"

      - name: 動画を作る
        id: build
        env:
          IN_FORMAT: ${{ steps.cfg.outputs.format }}
        run: |
          mkdir -p out
          ARGS=(--day "${{ steps.name.outputs.day }}" --out out/reel.mp4)
          if [ "${IN_FORMAT:-short}" = "short" ]; then
            ARGS+=(--slides-dir out/cards)
          fi
          if [ -f out/voice/manifest.json ]; then
            ARGS+=(--narration-dir out/voice)
            echo "narration_used=1" >> "$GITHUB_OUTPUT"
          else
            echo "narration_used=" >> "$GITHUB_OUTPUT"
          fi
          python3 video/build.py "${ARGS[@]}"

      - name: 生成物を確認
        run: |
          ls -la out/
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 out/reel.mp4
          ffmpeg -hide_banner -i out/reel.mp4 -af volumedetect -f null - 2>&1 | grep -E "mean_volume|max_volume"

      - uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.name.outputs.day }}
          path: out/
          retention-days: 7

      # ここから先は R2 の認証情報が無ければ自動でスキップされる
      - name: R2 へ置く
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 video/upload.py --file out/reel.mp4 --name "${{ steps.name.outputs.file }}"

      - name: 配信URLが本当に返るか確かめる
        if: ${{ steps.upload.outputs.video_url != '' }}
        run: |
          URL="${{ steps.upload.outputs.video_url }}"
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$URL" || echo 000)
            echo "  試行 $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "配信URLが 200 を返しません: $URL"; exit 1

      - name: Instagram Reels へ投稿
        if: ${{ (steps.cfg.outputs.targets == 'all' || steps.cfg.outputs.targets == 'instagram') && steps.upload.outputs.video_url != '' }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          NARRATION_USED: ${{ steps.build.outputs.narration_used }}
          REEL_FORMAT: ${{ steps.cfg.outputs.format }}
          REEL_ITEM: out/cards/post.json
          TTS_CREDIT: VOICEVOX:${{ vars.VOICEVOX_SPEAKER_NAME || '玄野武宏' }}
        run: |
          if [ "${{ steps.cfg.outputs.publish }}" = "yes" ]; then
            python3 video/publish.py --day "${{ steps.name.outputs.day }}" --video-url "${{ steps.upload.outputs.video_url }}"
          else
            python3 video/publish.py --day "${{ steps.name.outputs.day }}" --video-url "${{ steps.upload.outputs.video_url }}" --dry-run
          fi

      - name: YouTube ショートへ投稿
        if: ${{ steps.cfg.outputs.targets == 'all' || steps.cfg.outputs.targets == 'youtube' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ steps.cfg.outputs.yt_privacy }}
          NARRATION_USED: ${{ steps.build.outputs.narration_used }}
          REEL_FORMAT: ${{ steps.cfg.outputs.format }}
          REEL_ITEM: out/cards/post.json
          TTS_CREDIT: VOICEVOX:${{ vars.VOICEVOX_SPEAKER_NAME || '玄野武宏' }}
        run: |
          FLAG="--dry-run"
          if [ "${{ steps.cfg.outputs.publish }}" = "yes" ]; then FLAG=""; fi
          python3 channels/youtube.py --day "${{ steps.name.outputs.day }}" --file out/reel.mp4 $FLAG

      - name: TikTok へ投稿
        if: ${{ (steps.cfg.outputs.targets == 'all' || steps.cfg.outputs.targets == 'tiktok') && steps.upload.outputs.video_url != '' }}
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE || 'inbox' }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
          NARRATION_USED: ${{ steps.build.outputs.narration_used }}
          REEL_FORMAT: ${{ steps.cfg.outputs.format }}
          REEL_ITEM: out/cards/post.json
          TTS_CREDIT: VOICEVOX:${{ vars.VOICEVOX_SPEAKER_NAME || '玄野武宏' }}
        run: |
          FLAG="--dry-run"
          if [ "${{ steps.cfg.outputs.publish }}" = "yes" ]; then FLAG=""; fi
          python3 channels/tiktok.py --day "${{ steps.name.outputs.day }}" --video-url "${{ steps.upload.outputs.video_url }}" $FLAG

      - name: Threads へ動画を投稿
        if: ${{ (steps.cfg.outputs.targets == 'all' || steps.cfg.outputs.targets == 'threads') && steps.upload.outputs.video_url != '' }}
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          NARRATION_USED: ${{ steps.build.outputs.narration_used }}
          REEL_FORMAT: ${{ steps.cfg.outputs.format }}
          REEL_ITEM: out/cards/post.json
          TTS_CREDIT: VOICEVOX:${{ vars.VOICEVOX_SPEAKER_NAME || '玄野武宏' }}
        run: |
          FLAG="--dry-run"
          if [ "${{ steps.cfg.outputs.publish }}" = "yes" ]; then FLAG=""; fi
          python3 channels/threads_video.py --day "${{ steps.name.outputs.day }}" --video-url "${{ steps.upload.outputs.video_url }}" $FLAG

      - name: R2 が未設定のとき
        if: ${{ steps.upload.outputs.video_url == '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のため、"
          echo "アップロードと投稿を行っていません。動画は Artifacts にあります。"

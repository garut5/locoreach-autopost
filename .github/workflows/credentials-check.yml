name: 認証情報の棚卸し（値は出さない）

# どの媒体に投稿できて、どれがまだ足りないかを一覧にする。
# **値は絶対に出力しない**。有無だけを ○ / ✗ で出す。
# 手動実行のみ。
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 棚卸し
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          have() { [ -n "${!1}" ] && echo "○" || echo "✗"; }
          missing=""
          row() {  # row <媒体> <必要な変数...>
            local media="$1"; shift
            local mark="✅" list=""
            for v in "$@"; do
              if [ -z "${!v}" ]; then mark="❌"; missing="$missing $v"; list="$list ~~$v~~"; else list="$list $v"; fi
            done
            echo "| $media | $mark |$list |" >> "$GITHUB_STEP_SUMMARY"
          }
          {
            echo "## 投稿できる媒体"
            echo ""
            echo "| 媒体 | 投稿可否 | 必要な認証情報（取消線＝未登録） |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          row "Instagram フィード・ストーリーズ" IG_TOKEN IG_USER_ID
          row "Instagram リール" IG_TOKEN IG_USER_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          row "Threads（画像）" THREADS_TOKEN THREADS_USER_ID
          row "Threads（動画）" THREADS_TOKEN THREADS_USER_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          row "X" X_API_KEY X_API_SECRET X_ACCESS_TOKEN X_ACCESS_SECRET
          row "YouTube Shorts" YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN
          row "TikTok" TIKTOK_CLIENT_KEY TIKTOK_CLIENT_SECRET TIKTOK_REFRESH_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          {
            echo ""
            echo "## 付帯"
            echo ""
            echo "| 用途 | 有無 |"
            echo "|---|---|"
            echo "| R2 へのアップロード（動画・画像） | $(have CLOUDFLARE_API_TOKEN) |"
            echo "| トークン自動更新の書き戻し GH_PAT | $(have GH_PAT) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$missing" ]; then
            echo "未登録:$missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "すべて登録済み。" >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$GITHUB_STEP_SUMMARY"

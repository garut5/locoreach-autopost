name: daily-instagram-post

# 20:00 JST。その日の記事からカルーセルを作って投稿する。
#
# content.json の7セットは固定で、毎週まったく同じ投稿が繰り返されていた。
# 記事は毎朝1本ずつ増えるので、そこから作れば中身が毎日変わり、
# しかも記事（＝診断フォームへの導線）へ送客できる。
# 記事から作れなかった日は、従来の固定セットに落ちる（投稿を止めない）。
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1=dry run (no post)'
        required: false
        default: '0'
      source:
        description: 'article=記事から作る / fixed=従来の固定セット'
        type: choice
        options: [article, fixed]
        default: article

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存パッケージ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          pip install --quiet Pillow

      # 失敗しても投稿は止めない。作れなければ従来の固定セットで出す
      - name: 記事から投稿一式を作る
        id: make
        if: ${{ inputs.source != 'fixed' }}
        continue-on-error: true
        run: |
          python3 scripts/make_post.py --outdir out/post
          echo "ready=1" >> "$GITHUB_OUTPUT"

      # cron が遅れて翌朝に流れると、その時刻にはまだ前日の記事しか無く、
      # 見張りが投げ直したぶんと合わせて同じ記事が2回出る（2026-08-29）。
      # 「実行が重なったか」ではなく「その記事をもう出したか」で見る。
      - name: 同じ記事を二度出さない
        id: dedupe
        if: ${{ steps.make.outputs.ready == '1' }}
        run: |
          if python3 scripts/posted.py check --channel carousel --item out/post/post.json; then
            echo "fresh=1" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 画像を R2 へ置く
        id: upload
        if: ${{ steps.make.outputs.ready == '1' && steps.dedupe.outputs.fresh == '1' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 tools/upload_r2.py out/post --prefix sns
          echo "ready=1" >> "$GITHUB_OUTPUT"

      # Instagram は image_url を自分で取りに来る。取れない URL を渡すと
      # 途中まで進んでから失敗するので、投稿前にこちらで確かめる
      - name: 画像が本当に返るか確かめる
        id: check
        if: ${{ steps.upload.outputs.ready == '1' }}
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, sys, urllib.request
          d = json.load(open("out/post/post.json", encoding="utf-8"))
          urls = d["image_urls"] + [d["story_url"]]
          for u in urls:
              req = urllib.request.Request(u, method="HEAD",
                                           headers={"User-Agent": "locoreach-autopost/1.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  if r.status != 200:
                      sys.exit(f"{u} が {r.status} を返しました")
          print(f"✓ {len(urls)} 件すべて取得できました")
          PY
          echo "ready=1" >> "$GITHUB_OUTPUT"

      # 投稿済みと判定された回は、固定セットに落とさずここで終える。
      # 落とすと「毎週同じ7本」が割り込むことになり、記事連動が崩れる。
      - name: 投稿する
        if: ${{ steps.dedupe.outputs.fresh != '0' }}
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${{ steps.check.outputs.ready }}" = "1" ]; then
            export POST_ITEM=out/post/post.json
          else
            echo "記事から作れなかったので、従来の固定セットで投稿します"
          fi
          python3 post.py

      - name: 投稿済みのため出しませんでした
        if: ${{ steps.dedupe.outputs.fresh == '0' }}
        run: |
          echo "この記事はすでにカルーセルとして投稿済みです。二重投稿になるため出していません。"
          echo "posted.json の carousel を見てください。"

      # 出したことを記録する。次に同じ記事で走っても止まるようにするため。
      # dry-run の回は記録しない（出していないので）。
      #
      # 最新の main に載せ直してから書く。ほかのワークフローも同じ
      # posted.json を触るので、そのまま push すると弾かれる。
      - name: 投稿済みとして記録する
        if: ${{ success() && steps.dedupe.outputs.fresh == '1' && inputs.dry_run != '1' }}
        run: |
          for i in 1 2 3 4; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            python3 scripts/posted.py record --channel carousel --item out/post/post.json
            git add posted.json
            if git diff --cached --quiet; then echo "記録する変更はありません"; exit 0; fi
            git -c user.name="locoreach-bot" -c user.email="info@camomile.co.jp" \
                commit -q -m "chore: カルーセルの投稿済みを記録"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "  push に失敗しました。$((2 ** i))秒後に再試行します（$i/4）"
            sleep $((2 ** i))
          done
          echo "記録を push できませんでした"; exit 1

      # 定期実行は誰も見ていない時間に走る。落ちたことに気づけないと、
      # 記事だけ出て SNS が止まった状態が何日も続く。
      # NOTIFY_WEBHOOK 未設定なら何もしない（終了コード0）。
      - name: 失敗を Google Chat へ知らせる
        if: failure()
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          WF_NAME: ${{ github.workflow }}
          WF_REPO: ${{ github.repository }}
          WF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify.py

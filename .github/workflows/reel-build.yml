name: リール動画を作る（検証用・投稿しない）

# 手動実行のみ。既存の post.yml（20:00 JST）には一切関与しない。
# 生成物は Artifacts からダウンロードして目視・試聴できる。
on:
  workflow_dispatch:
    inputs:
      day:
        description: "曜日キー（mon〜sun）。空なら当日"
        required: false
        default: ""
      narration:
        description: "ナレーションを入れる（voicevox / none）"
        type: choice
        options: [voicevox, none]
        default: voicevox
      format:
        description: "short=1コツ・約25秒（推奨） / full=カルーセル10枚・約70秒"
        type: choice
        options: [short, full]
        default: short
      preview:
        description: "ブラウザで見られるURLを出す（R2 に置くだけ。SNSには投稿しない）"
        type: choice
        options: [ "yes", "no" ]
        default: "yes"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # VOICEVOX ENGINE。無料・日本語専用。商用利用可だがクレジット表記が必要。
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
        ports:
          - 50021:50021

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          pip install --quiet numpy Pillow

      - name: VOICEVOX の起動を待つ
        if: ${{ inputs.narration == 'voicevox' }}
        run: |
          for i in $(seq 1 60); do
            if curl -sS --max-time 5 http://127.0.0.1:50021/version >/dev/null 2>&1; then
              echo "VOICEVOX 起動: $(curl -sS http://127.0.0.1:50021/version)"
              exit 0
            fi
            sleep 5
          done
          echo "VOICEVOX が起動しませんでした"; exit 1

      # ショートは1コツに絞った専用カードを描く。カルーセルの10枚は
      # 表紙と目次に冒頭2秒を使ってしまい、リールでは見られないため。
      - name: ショート用のカードを描く
        if: ${{ inputs.format == 'short' }}
        env:
          IN_DAY: ${{ inputs.day }}
        run: |
          DAY="${IN_DAY:-$(TZ=Asia/Tokyo date +%a | tr 'A-Z' 'a-z')}"
          python3 video/short.py --day "$DAY"
          python3 video/cards.py --day "$DAY" --outdir out/cards

      - name: ナレーション音声を合成
        if: ${{ inputs.narration == 'voicevox' }}
        env:
          VOICEVOX_URL: http://127.0.0.1:50021
          VOICEVOX_SPEAKER_NAME: ${{ vars.VOICEVOX_SPEAKER_NAME || '玄野武宏' }}
          IN_DAY: ${{ inputs.day }}
          IN_FORMAT: ${{ inputs.format }}
        run: python3 video/narrate.py --day "$IN_DAY" --outdir out/voice --format "${IN_FORMAT:-short}"

      - name: 動画を作る
        env:
          IN_DAY: ${{ inputs.day }}
          IN_FORMAT: ${{ inputs.format }}
        run: |
          mkdir -p out
          ARGS=(--day "$IN_DAY" --out out/reel.mp4)
          if [ "${IN_FORMAT:-short}" = "short" ]; then
            ARGS+=(--slides-dir out/cards)
          fi
          if [ -f out/voice/manifest.json ]; then
            ARGS+=(--narration-dir out/voice)
          fi
          python3 video/build.py "${ARGS[@]}"

      - name: 生成物を確認
        run: |
          ls -la out/
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 out/reel.mp4
          ffmpeg -hide_banner -i out/reel.mp4 -af volumedetect -f null - 2>&1 | grep -E "mean_volume|max_volume"

      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/
          retention-days: 7

      # Artifacts は zip でしか落とせず、その場で再生できない。
      # 確認のためだけに R2 へ置き、media.camomile.co.jp から直接見られるようにする。
      # ここは投稿処理を一切呼ばない。キャッシュが immutable なので実行ごとに別名にする。
      - name: 確認用URLを出す
        if: ${{ inputs.preview == 'yes' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          IN_DAY: ${{ inputs.day }}
          IN_FORMAT: ${{ inputs.format }}
        run: |
          DAY="${IN_DAY:-$(TZ=Asia/Tokyo date +%a | tr 'A-Z' 'a-z')}"
          NAME="preview-${DAY}-${IN_FORMAT:-short}-${GITHUB_RUN_NUMBER}.mp4"
          python3 video/upload.py --file out/reel.mp4 --name "$NAME"
          {
            echo "## 確認用"
            echo ""
            echo "https://media.camomile.co.jp/reels/$NAME"
            echo ""
            echo "ブラウザで開けばそのまま再生できます（投稿はされていません）。"
          } >> "$GITHUB_STEP_SUMMARY"

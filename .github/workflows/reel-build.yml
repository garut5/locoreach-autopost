name: リール動画を作る（検証用・投稿しない）

# 手動実行のみ。既存の post.yml（20:00 JST）には一切関与しない。
# 生成物は Artifacts からダウンロードして目視・試聴できる。
on:
  workflow_dispatch:
    inputs:
      day:
        description: "曜日キー（mon〜sun）。空なら当日"
        required: false
        default: ""
      narration:
        description: "ナレーションを入れる（voicevox / none）"
        type: choice
        options: [voicevox, none]
        default: voicevox

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # VOICEVOX ENGINE。無料・日本語専用。商用利用可だがクレジット表記が必要。
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
        ports:
          - 50021:50021

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet numpy Pillow

      - name: VOICEVOX の起動を待つ
        if: ${{ inputs.narration == 'voicevox' }}
        run: |
          for i in $(seq 1 60); do
            if curl -sS --max-time 5 http://127.0.0.1:50021/version >/dev/null 2>&1; then
              echo "VOICEVOX 起動: $(curl -sS http://127.0.0.1:50021/version)"
              exit 0
            fi
            sleep 5
          done
          echo "VOICEVOX が起動しませんでした"; exit 1

      - name: ナレーション音声を合成
        if: ${{ inputs.narration == 'voicevox' }}
        env:
          VOICEVOX_URL: http://127.0.0.1:50021
          VOICEVOX_SPEAKER: "3"
        run: python3 video/narrate.py --day "${{ inputs.day }}" --out out/narration.wav

      - name: 動画を作る
        run: |
          mkdir -p out
          if [ -f out/narration.wav ]; then
            python3 video/build.py --day "${{ inputs.day }}" --out out/reel.mp4 --narration out/narration.wav
          else
            python3 video/build.py --day "${{ inputs.day }}" --out out/reel.mp4
          fi

      - name: 生成物を確認
        run: |
          ls -la out/
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 out/reel.mp4
          ffmpeg -hide_banner -i out/reel.mp4 -af volumedetect -f null - 2>&1 | grep -E "mean_volume|max_volume"

      - uses: actions/upload-artifact@v4
        with:
          name: reel
          path: out/
          retention-days: 7

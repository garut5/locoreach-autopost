name: 会社サイトの自動投稿を起こす（camomile.co.jp）

# 会社サイトへの投稿は、サイトの中の mu-plugin
# （wp-content/mu-plugins/camomilemediabridge.php）が行う。
# ここはそれを「起こす」だけ。
#
# ■ なぜ外から投稿しないのか
#
# 当初は REST API で押し込む作りにしたが、Xserver が Authorization
# ヘッダを PHP に渡す前に落とすため、認証が成立しなかった。
# .htaccess の SetEnvIf / RewriteRule、PHP_AUTH_USER へ展開する
# mu-plugin のいずれでも届かず、2026-08-26 に断念した。
# scripts/wp.py と scripts/corporate_post.py はその名残で、
# 資格情報が無いので実行しても何もしない。
#
# ■ なぜ起こす必要があるのか
#
# WP-Cron は「誰かがサイトを訪れたとき」に動く。会社サイトは
# 訪問が多くないので、訪問任せだと投稿が何時間も遅れうる。
# ここから毎日叩いて、確実に1日1回動かす。
#
# 認証情報は使わない。公開URLを叩くだけ。
on:
  schedule:
    # 02:00 UTC = 11:00 JST。記事の公開（07:03 JST）より十分あと
    - cron: "23 2 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: WP-Cron を起こす
        run: |
          URL="https://camomile.co.jp/wp-cron.php?doing_wp_cron=$(date +%s)"
          for i in 1 2 3; do
            CODE=$(curl -sS --max-time 60 -o /dev/null -w "%{http_code}" \
                   -A "locoreach-autopost/1.0" "$URL" || echo 000)
            echo "  試行 $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "wp-cron.php が 200 を返しませんでした"; exit 1

      - name: 会社サイトに今日の記事が載ったか確かめる
        run: python3 scripts/corporate_check.py

      - name: 失敗を Google Chat へ知らせる
        if: failure()
        env:
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          WF_NAME: ${{ github.workflow }}
          WF_REPO: ${{ github.repository }}
          WF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/notify.py
